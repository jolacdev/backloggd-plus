# Submits a published Firefox release to AMO for Mozilla review.
# Automatic runs are triggered when a maintainer publishes a release prepared by `release.yml`.
# Manual runs validate credentials or retry a published release.
name: Publish to Firefox

on:
  release:
    types: [published]

  workflow_dispatch: # Run manually to test credentials or retry a submission.
    inputs:
      release_tag: # [Custom Key]
        description: 'Published release tag to submit, e.g. v1.1.0'
        required: true
        type: string
      dry_run: # [Custom Key]
        description: 'Check credentials without uploading or submitting'
        type: boolean
        default: true # Leave checked to test access; uncheck to submit the version.

permissions:
  contents: read

jobs:
  validate_release: # [Custom Key] Check the tag and release files before requesting the environment or using AMO secrets.
    name: Validate published release
    # Automatic runs accept stable release publications; manual runs must select master.
    if: >-
      vars.FIREFOX_PUBLISH_ENABLED == 'true' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # `steps.release.outputs` are generated by `check-github-release.ts`. And this `outputs` makes them available to the `submit` job below.
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }} # [Custom Key] Validated tag for the submission job.
      sha: ${{ steps.release.outputs.sha }} # [Custom Key] Exact tagged commit for the submission tooling.

    steps:
      - uses: actions/checkout@v7.0.1 # Fetch trusted master history and its release tags for validation.
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0 # Run the TypeScript check directly without installing dependencies.
        with:
          node-version-file: .node-version

      - name: Verify published release and packages
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }} # [Custom Key] Published event tag, or the tag entered for a manual retry.
          GH_TOKEN: ${{ github.token }} # Authenticate GitHub CLI (gh) to read the release and its files.
        run: node scripts/workflows/publish/check-github-release.ts # Validate the tag and required release files.

  submit: # [Custom Key] Download the release files and check AMO credentials or submit the version.
    name: Submit Firefox version
    needs: validate_release # An invalid tag, draft, prerelease, or missing ZIP stops before AMO credentials are available.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment: firefox-production # Get its AMO secrets and wait for approval if required reviewers are configured.

    # Prevent simultaneous submissions to the Firefox store.
    concurrency:
      group: firefox-production
      cancel-in-progress: false # Do not interrupt a submission already in progress.

    steps:
      - uses: actions/checkout@v7.0.1 # Check out the publishing script and its dependencies.
        with:
          ref: ${{ needs.validate_release.outputs.sha }} # Use the publishing script and dependencies from the validated release commit.
          fetch-depth: 0 # The script reads package.json from the release tag.
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0 # Install the Node.js version from `.node-version`.
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0 # Install the pnpm version from package.json#packageManager.
        with:
          cache: true # Reuse cached dependencies to reduce downloads.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download packages from a published release # Reuse GitHub's release files instead of building another extension.
        env:
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }} # [Custom Key] Tag checked by validate_release.
          GH_TOKEN: ${{ github.token }} # Token used by gh to read the release and download its files.
        run: gh release download "$RELEASE_TAG" --dir release-assets --pattern '*-firefox.zip' --pattern '*-sources.zip' # Save the Firefox and source ZIPs in release-assets/.

      # Give AMO credentials to the submission script only, not dependency installation.
      - name: Submit existing packages to AMO # DRY_RUN=true checks access; false submits ZIPs and release notes to Mozilla.
        env:
          RELEASE_TAG: ${{ needs.validate_release.outputs.release_tag }} # [Custom Key] Submit the validated release's files and notes.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }} # [Custom Key] Manual checkbox value; publication events always request a real submission.
          GH_TOKEN: ${{ github.token }} # Token used by the script to read GitHub release notes.
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }} # [Custom Key] AMO API key stored in firefox-production secrets.
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }} # [Custom Key] Matching AMO API secret stored in that environment.
        run: pnpm exec jiti scripts/workflows/publish/publish-firefox.ts
